  verified_on = "2026-10-10"

[[role]]
id = "thermal_cutoff"
module = "Control"
safety = true
requirement = "Bimetal, normally closed, auto-reset: opens at 50 °C (cold plates) and 80 °C (heatsinks). Switches relay coils, not load current. Certified (UL/VDE/ENEC) preferred."

  [[role.example]]
  name = "KSD301 / KSD9700 class, NC, 50 °C and 80 °C"
  status = "listing"
  source = "https://www.ebay.de/itm/394903220088"
  verified_on = "2026-10-11"
  notes = "Cheap, but the listings show no certification, and retail listings often mix up NO and NC at 50 C. Datasheets found (KSD9700 spec sheets) show 250 V / 5 A (CQC) or 10 A resistive, +-5 C tolerance, reset >= 35 C for the 50 C NC part; UL is often only 125 V. Test every unit (hot-air gun + thermometer) before use."

  [[role.example]]
  name = "Sensata-Airpax 67L050 (NC, opens on rise at 50 C) and 67L080 (NC, 80 C)"
  status = "listing"
  source = "https://www.digikey.cn/en/products/detail/sensata-airpax/67L050/1631970"
  verified_on = "2026-10-11"
  notes = "SPST NC bimetal, auto-reset, +-5 C. 67L050 resets at 30 C; 67L080 (https://nl.farnell.com/sensata-airpax/67l080/switch-thermal-n-c-80-c/dp/1524704) resets at 55 C. Rated only 0.5-1 A at 48 VDC / 120 VAC, which is plenty for a relay coil (the intended use) but not for load current. Per the Sensata 6700 datasheet VDE approval applies to the P (bracket) suffix; I found no UL listing, so the certification wish is only partly met. Manufacturer PDF not opened: only distributor excerpts, so treat as a listing."

  [[role.example]]
  name = "RS PRO bimetallic thermostats (UL/cUL/ENEC listed)"
  status = "listing"
  source = "https://uk.rs-online.com/web/p/thermostatic-switches/2228228"
  verified_on = "2026-10-10"
  notes = "The certified part found has the wrong temperature (70 °C). Help wanted: a certified NC part at 50 °C."

[[role]]
id = "leak_sensor"
module = "Control"
safety = true
requirement = "Detects water in the hub drip tray and at the hub-side couplings; digital or analog input to the control MCU."

  [[role.example]]
  name = "HW group WLD Relay + WLD sensing cable"
  status = "listing"
  source = "https://hw-group.com/support/top-selling-wld-component-wld-relay"
  verified_on = "2026-10-11"
  notes = "12 V module with a cable (rope) input that also alarms when the sensing cable is disconnected, so it is open-wire detectable. Output contact rating not stated on the page: check before wiring to a 3.3 V GPIO (use the contact with a pull-up, or an optocoupler)."

  [[role.example]]
  name = "Andel Floodline Leak 1 Mk II (rope/cable leak panel)"
  status = "listing"
  source = "https://a.storyblok.com/f/121333/x/ed8fe6cc90/42-floodline-leak-1-mkii.pdf"
  verified_on = "2026-10-11"
  notes = "12 or 24 V AC/DC supply; SPCO relay output 1 A at 24 VDC for 'leak' and a system-fault output for sensor or lead cable damage or disconnection. Bulky, so mounting space in the hub matters. A bare conductive-polymer rope on a raw GPIO is NOT recommended: it reads only ~20-150 on a 10-bit ADC, and DC excitation corrodes it."

