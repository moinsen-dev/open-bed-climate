# Open Bed Climate parts catalog: roles first, example parts second.
#
# Each [[role]] says WHAT is needed (requirement). Each [[role.example]] is ONE way to fill it.
# status:  "datasheet"  = key specs confirmed in the manufacturer datasheet
#          "listing"    = only seen in a distributor/retailer listing
#          "unverified" = plausible, not yet confirmed; please verify and open a PR
#          "rejected"   = checked and found unsuitable (kept so nobody re-checks it)
# PARTS.md is generated from this file:  cd software/obc && uv run python -m obc.render_parts
# Found a better part? See CONTRIBUTING.md ("parts hunter").

[[role]]
id = "tec_psu"
module = "Power"
safety = true
requirement = "Certified (IEC/EN/UL 62368-1), active PFC, 24 V, ≥ 280 W per zone. The builder must never wire mains: IEC C14 inlet or molded mains cord only."
notes = "24 V because the TEC driver is a buck converter: TECs need ~11.5 V at 5 A, so a 12 V input is too low. Big 600–750 W units (Mean Well RSP-750, UHP-750) have mains screw terminals and are only allowed inside a pre-assembled, closed power module (Tier 1)."

  [[role.example]]
  name = "Mean Well GST280A24-C6P (desktop, IEC C14)"
  status = "datasheet"
  source = "https://www.meanwellusa.com/upload/pdf/GST280A/GST280A-spec.pdf"
  verified_on = "2026-10-11"
  notes = "Confirmed: 24 V / 11.67 A / 280.08 W, 85-264 VAC, PF > 0.95 at 230 VAC (the datasheet gives a PF figure, not the words 'active PFC'), 93 % efficiency, IEC320-C14 inlet, output plug C6P = Molex 39-01-2060 equivalent (6-pin). Safety: UL/CSA/EN/IEC 62368-1. One unit per zone (280 W covers ~18 A at ~11.5 V through the buck with margin)."

  [[role.example]]
  name = "Mean Well RSP-750-24 inside a closed power module (C14 + fuse + switch)"
  status = "datasheet"
  source = "https://www.meanwell.com/Upload/PDF/RSP-750/RSP-750-SPEC.PDF"
  verified_on = "2026-10-10"
  notes = "Tier 1 only. AC input on terminal block TB1, so the mains side must be assembled and tested by a qualified person. Has a fan."

  [[role.example]]
  name = "HP common-slot server PSU + breakout board"
  status = "rejected"
  source = "https://tindie.com/products/gumslone/smart-wifi-server-psu-breakout-board"
  verified_on = "2026-10-10"
  notes = "Loud high-RPM fans (bedroom), the certification does not cover the DIY breakout, and pinouts vary by model."

[[role]]
id = "aux_psu"
module = "Power"
safety = true
requirement = "Certified, 12 V, IEC inlet, sized so the continuous load stays ≤ 80 % of the rating (kit check: 25 W per zone + 15 W shared, i.e. ≥ 50 W for one zone, ≥ 82 W for two). Feeds pumps, fans, control MCU and hub."

  [[role.example]]
  name = "Mean Well GST90A12-P1M (desktop)"
  status = "datasheet"
  source = "https://www.meanwellusa.com/upload/pdf/GST90A/GST90A-spec.pdf"
  verified_on = "2026-10-11"
  notes = "Confirmed: 12 V / 6.67 A / 80 W (not 90 W: the 90 W versions are the 15 V and up models), IEC320-C14 inlet, DC plug P1M (5.5 x 2.5 x 11 mm, center positive), UL/CSA/EN/IEC 62368-1, PF > 0.91 at 230 VAC. Enough for one zone (Solo Starter, 40 W load); too small for two zones (65 W > 80 % of 80 W)."

  [[role.example]]
  name = "Mean Well GST120A12-R7B (desktop, two-zone kits)"
  status = "listing"
  source = "https://www.meanwellusa.com/Upload/PDF/Adaptor_EN.pdf"
  verified_on = "2026-10-12"
  notes = "Mean Well's adaptor installation manual: the 12 V model is 8.5 A = 102 W (120 W only for 20-48 V), so it is not a 120 W supply. Distributor listings (TRC, TME, Mouser): IEC320-C14 inlet, built-in active PFC, UL 62368-1, R7B output = locking 4-pin DIN (KYCON KPPX-4P), 1 m 16 AWG. Two-zone load 65 W = 64 % of 102 W, inside the 80 % margin. GST120A spec sheet itself not opened."

[[role]]
id = "tec_drive"
module = "Power"
safety = true
requirement = "Smooth DC, current-controlled (ripple < 10 % of max current), ≥ 18 A per zone (4 TECs in parallel at 4.5 A), controllable from a 3.3 V MCU. Its current limit is set by software, so the per-zone DC fuse and zone relay are required as backstops."
notes = "Polarity for heat/cool comes from a DPDT relay (role polarity_relay), switched only at zero current; the firmware enforces a 2 s dead time. Raw PWM is not allowed: it cuts TEC efficiency, and DIY builds that used it ran their capacitors hot."

  [[role.example]]
  name = "DPS5020 programmable buck module (50 V / 20 A, Modbus RTU over UART)"
  status = "listing"
  source = "https://tech.scargill.net/dps5020-diy-power-supply/"
  verified_on = "2026-10-10"
  notes = "One per zone. Output ≤ ~90 % of input, so it needs the 24 V supply. Output ripple not yet measured: please measure it. Early units had a failed output capacitor. Register map cross-checked against community sources (Scargill thread script, haarer/pyDPS5015): 0x0000 U-set, 0x0001 I-set, 0x0002 U-out, 0x0003 I-out, 0x0009 on/off, 16-bit holding registers; 2 decimals (x100) for voltage and, on the DPS5020, current. The vendor protocol PDF (Ruideng, V1.2) could not be fetched here (bot wall), so function codes 0x03/0x06/0x10 and the exact DPS5020 current scaling are from secondary sources: verify on your unit. Note the second register block at 0x0050+ is stored memory group M0 (U-set/I-set/OVP/OCP/OPP...), not the live setpoint."

  [[role.example]]
  name = "Riden RD6012 (60 V / 12 A, Modbus RTU)"
  status = "listing"
  source = "https://www.cnx-software.com/2021/12/15/riden-rd6012p-usb-wifi-dc-power-supply-connects-to-your-pc-or-smartphone/"
  verified_on = "2026-10-10"
  notes = "12 A, so it covers 2 TECs in parallel at 5 A (Solo Starter). An ESPHome community config exists."

  [[role.example]]
  name = "TI DRV8262 H-bridge + LC filter (TEC mode)"
  status = "datasheet"
  source = "https://www.ti.com/product/DRV8262"
  verified_on = "2026-10-10"
  notes = "Tier 1 power board candidate. The datasheet has TEC guidance (PWM + 2nd-order LC filter, ripple < 10 %). Needs a custom PCB."

  [[role.example]]
  name = "Meerstetter TEC-1091 / TEC-1122"
  status = "rejected"
  source = "https://www.meerstetter.ch/"
  verified_on = "2026-10-10"
  notes = "Excellent but far over budget (≈ USD 370–1,600 each, reseller prices); the 1091 is only ±4 A."

[[role]]
id = "polarity_relay"
module = "Power"
safety = true
requirement = "DPDT, ≥ 20 A contacts at 24 V DC, 12 V coil; plus a per-zone enable relay between TEC driver and TECs whose coil goes through the thermal cutoffs, and a per-zone DC fuse."

  [[role.example]]
  name = "CIT Relay A102CS12VDC (12 V coil, 2 Form C = DPDT, automotive) + per-zone 20 A DC blade fuse"
  status = "datasheet"
  source = "https://atta.szlcsc.com/upload/public/pdf/source/231023/A10-ebfe5758433fce54477dea240fbb29a9.pdf"
  verified_on = "2026-10-11"
  notes = "A10 series datasheet: 2C contacts rated 25 A / 30 A at 14 VDC on NO and 20 A / 25 A at 14 VDC on NC, max switching voltage 28 VDC, limiting continuous current 30/25 A (NO/NC) at 23 C, derated to 25/20 A at 85 C. The relay sits after the buck driver so it never sees 24 V; the voltage ceiling is 14 V (TEC_VOLTAGE_CEILING_V). With 18 A per zone the NC side is marginal at temperature, so wire the load through the NO contacts in both polarities (H-bridge-style: two SPDT relays, or the 2C with the NO pair cross-wired) and switch only at zero current. Datasheet copy is a distributor mirror: confirm against citrelay.com."

  [[role.example]]
  name = "American Zettler AZ9891J-2C-12DE (12 V coil, DPDT, 30 A)"
  status = "listing"
  source = "https://www.digikey.com/en/products/detail/american-zettler/AZ9891J-2C-12DE/12171586"
  verified_on = "2026-10-11"
  notes = "Distributor listing: 30 A contacts, ~67 mA coil, 16 VDC max switching voltage, sealed. DC contact curve not checked; get the manufacturer datasheet before use."

