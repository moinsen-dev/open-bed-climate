# Open Bed Climate shopping list: Solo Starter, prototype 0.
#
# One orderable line per thing to buy. `role` is a role id from hardware/parts.toml, or
# "consumable" (small parts, wire, fittings), "bench" (test rig only) or "tool" (qty 0 = you probably own it).
# status: "listing"  = price seen on the shop page on checked_on
#         "estimate" = no confirmed price (page not readable, net-only price, or no exact product page); reasoned guess
# stage:  "bench" = everything for the bench build (10 L water container as thermal load, no bed)
#         "bed"   = added when moving to the bed (mat, couplings, long insulated lines)
#         "tool"  = not counted in the subtotals
# pack:   optional, units per pack (default 1). Counted units = qty * pack (the tests check counts per role).
# MD is generated:  cd software/obc && uv run python -m obc.shopping

[list]
kit = "solo-starter"
currency = "EUR"
checked_on = "2026-10-11"
region = "Germany / EU, prices incl. VAT"
notes = """
Shipping is not included (expect ~6 EUR per shop; ~8 shops). Prices change; re-check before ordering.
Loop size is 13/10 mm (ID 10 / OD 13) everywhere except the cold-plate barbs and the mat's 4 mm channels.
Metals: brass/copper only (G1/4 fittings, QD3, sensors, copper cold plates). No aluminium in the wet path (parts.toml).
Pump + 6 fans must stay inside the kit's 25 W per-zone overhead budget: run the DDC at <= 50 % and the fans at quiet speed.
Sensors match the firmware (board.rs): one ADS1115 @ 0x48, zone 0 uses ch0 = water (inline NTC) and ch1 = TEC hot face
(bead NTC). Future, not bought: parts.toml also asks for water in AND out, dual NTCs per cold plate and an NTC on every
heatsink; add them when board.rs reads more channels.
"""

