notes = "Relay output signals water OR disconnected cable (fault output). Price not shown on the page. Wire the contact so dry = LOW at GP21 with the 10 k pull-up (WIRING.md). Kept after a second search (2026-10-11): the cheap relay-output leak modules (ATO, Amazon 12 V modules, Winland WaterBug) only alarm on water and do not report an open or unplugged sensor cable, so a broken wire would read as dry. The WLD relay also switches on cable disconnect, which matches the firmware input (HIGH = leak or open wire). Cheaper fail-safe fallback: an NC float switch in the drip tray wired to GND (dry = LOW, float lifts or wire breaks = HIGH), but it only reacts to ~1 cm of standing water, not to drops."

