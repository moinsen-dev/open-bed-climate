name: release
# Builds the installable firmware and, for a v* tag, publishes it as a GitHub release:
#   obc-pico2-<kit>.uf2     Pico 2 control firmware, one per kit (drag onto the RP2350 drive in BOOTSEL mode)
#   obc-hub-factory.bin     ESP32-S3 hub, ready-made ESPHome image (browser installer at /install/ on the website)
#   open-bed-climate-card.js Home Assistant dashboard card (hub/ha-card)
#   SHA256SUMS
# A manual run (workflow_dispatch) only builds and keeps the files as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Prebuilt picotool from raspberrypi/pico-sdk-tools, pinned by checksum. It adds the RP2350-E10 absolute block.
  PICOTOOL_URL: https://github.com/raspberrypi/pico-sdk-tools/releases/download/v2.3.1-0/picotool-2.3.1-x86_64-lin.tar.gz
  PICOTOOL_SHA256: 878a1a1e7d8336b8be60300c7218f366d9790c0d3a211b181d6d172e80b1248e
  ESPHOME_VERSION: "2026.9.1"

jobs:
  pico2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kit: [solo-starter, duo-standard, duo-reference]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
      - name: Build
        working-directory: firmware/obc-pico2
        run: cargo build --release --locked --no-default-features --features kit-${{ matrix.kit }}
      - name: Install picotool
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libusb-1.0-0
          curl -fsSL -o picotool.tar.gz "$PICOTOOL_URL"
          echo "$PICOTOOL_SHA256  picotool.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/picotool" && tar xzf picotool.tar.gz -C "$RUNNER_TEMP/picotool" --strip-components=1
          "$RUNNER_TEMP/picotool/picotool" version
      - name: Convert ELF to UF2 (RP2350-ARM-S, with RP2350-E10 absolute block)
        run: |
          mkdir -p out
          "$RUNNER_TEMP/picotool/picotool" uf2 convert firmware/obc-pico2/target/thumbv8m.main-none-eabihf/release/obc-pico2 \
            -t elf out/obc-pico2-${{ matrix.kit }}.uf2 --family rp2350-arm-s --abs-block
          python3 -I firmware/tools/check_uf2.py out/obc-pico2-${{ matrix.kit }}.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: pico2-${{ matrix.kit }}
          path: out/obc-pico2-${{ matrix.kit }}.uf2
          if-no-files-found: error

  hub-factory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/esphome
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the factory image from this commit's components
        run: |
          python3 factory_local.py "${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}"
          uvx --from "esphome==$ESPHOME_VERSION" esphome compile obc-hub-factory.local.yaml
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp .esphome/build/open-bed-climate/build/firmware.factory.bin "$GITHUB_WORKSPACE/out/obc-hub-factory.bin"
          # An ESP32 factory image starts with the bootloader's image header (magic 0xE9).
          test "$(head -c1 "$GITHUB_WORKSPACE/out/obc-hub-factory.bin" | od -An -tx1 | tr -d ' ')" = e9
      - uses: actions/upload-artifact@v4
        with:
          name: hub-factory
          path: out/obc-hub-factory.bin
          if-no-files-found: error

  ha-card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/ha-card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: hub/ha-card/.nvmrc
          cache: npm
          cache-dependency-path: hub/ha-card/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ha-card
          path: hub/ha-card/dist/open-bed-climate-card.js
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [pico2, hub-factory, ha-card]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and notes
        working-directory: out
        run: |
          sha256sum obc-pico2-*.uf2 obc-hub-factory.bin open-bed-climate-card.js > SHA256SUMS
          cat > ../notes.md <<EOF
          Firmware for Open Bed Climate ${GITHUB_REF_NAME}. **Not yet run on real hardware: test it on the bench first** (see SAFETY.md and hardware/WIRING.md).

          | File | For |
          |---|---|
          | \`obc-pico2-solo-starter.uf2\` | Pico 2 control board, Solo Starter kit (1 zone, 3 TECs, 5.0 A per TEC) |
          | \`obc-pico2-duo-standard.uf2\` | Pico 2 control board, Duo Standard kit (2 zones, 4 TECs, 4.5 A per TEC) |
          | \`obc-pico2-duo-reference.uf2\` | Pico 2 control board, Duo Reference kit (2 zones, 4 TECs, 5.0 A per TEC) |
          | \`obc-hub-factory.bin\` | ESP32-S3 hub (ESPHome ${ESPHOME_VERSION}), full flash image at offset 0 |
          | \`open-bed-climate-card.js\` | Home Assistant dashboard card: copy to \`/config/www/\`, add the resource \`/local/open-bed-climate-card.js\` (see \`hub/ha-card/README.md\`) |

          **Flash the image for your kit.** The kit sets the TEC current limit; another kit's image can exceed your parts' rating.

          - Pico 2: hold BOOTSEL, plug in USB, drop the \`.uf2\` on the RP2350 drive.
          - Hub: use the browser installer at https://openbedclimate.moinsen.dev/install/ (Chrome or Edge), or \`esptool.py write_flash 0x0 obc-hub-factory.bin\`.

          Checksums: \`SHA256SUMS\`.
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag \
            out/obc-pico2-*.uf2 out/obc-hub-factory.bin out/open-bed-climate-card.js out/SHA256SUMS
