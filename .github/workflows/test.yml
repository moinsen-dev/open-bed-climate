name: tests
on: [push, pull_request]
jobs:
  reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/obc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q

  firmware-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  firmware-pico2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kit: [solo-starter, duo-standard, duo-reference]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
      - working-directory: firmware/obc-pico2
        run: cargo build --release --locked --no-default-features --features kit-${{ matrix.kit }}
      # Same UF2 conversion and check as release.yml (picotool pinned by checksum).
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libusb-1.0-0
          curl -fsSL -o picotool.tar.gz https://github.com/raspberrypi/pico-sdk-tools/releases/download/v2.3.1-0/picotool-2.3.1-x86_64-lin.tar.gz
          echo "878a1a1e7d8336b8be60300c7218f366d9790c0d3a211b181d6d172e80b1248e  picotool.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/picotool" && tar xzf picotool.tar.gz -C "$RUNNER_TEMP/picotool" --strip-components=1
          "$RUNNER_TEMP/picotool/picotool" uf2 convert firmware/obc-pico2/target/thumbv8m.main-none-eabihf/release/obc-pico2 \
            -t elf obc-pico2.uf2 --family rp2350-arm-s --abs-block
          python3 -I firmware/tools/check_uf2.py obc-pico2.uf2

  hub-protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/esphome/components/obc/test
    steps:
      - uses: actions/checkout@v4
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I.. test_opl.cpp -o test_opl && ./test_opl frames.txt
      - run: c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I.. test_schedule.cpp -o test_schedule && ./test_schedule schedule.txt

  hub-esphome:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/esphome
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          printf 'wifi_ssid: "ci"\nwifi_password: "cipassword"\napi_key: "%s"\nota_password: "ci"\n' "$(openssl rand -base64 32)" > secrets.yaml
          uvx --from esphome==2026.9.1 esphome compile obc-hub.yaml
      # Ready-made image (browser installer): the committed file validates, and builds with this commit's components.
      - run: |
          uvx --from esphome==2026.9.1 esphome config obc-hub-factory.yaml > /dev/null
          python3 factory_local.py && uvx --from esphome==2026.9.1 esphome compile obc-hub-factory.local.yaml

  ha-card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub/ha-card
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: hub/ha-card/.nvmrc
          cache: npm
          cache-dependency-path: hub/ha-card/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run verify
