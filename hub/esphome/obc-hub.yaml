# Open Bed Climate hub: ESP32-S3 running ESPHome, talking OPL to the Pico 2 control board.
# The hub only REQUESTS setpoints; temperature limits and all safety logic live in the control
# firmware (firmware/obc-pico2). Wiring: hardware/WIRING.md (GP0/GP1 on the Pico <-> UART here).
#
# Build it yourself: this file + secrets.yaml. The device (pins, entities, night programs) is in
# obc-hub-common.yaml; edit it there. No toolchain? Use the browser installer (README.md).

esphome:
  name: open-bed-climate
  friendly_name: Open Bed Climate

external_components:
  - source:
      type: local
      path: components

packages:
  device: !include obc-hub-common.yaml

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
