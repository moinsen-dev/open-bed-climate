# Open Bed Climate hub: the device part shared by obc-hub.yaml (build it yourself) and obc-hub-factory.yaml
# (the ready-made image for the browser installer and Home Assistant adoption). No secrets, no network settings.
# The hub only REQUESTS setpoints; temperature limits and all safety logic live in the control
# firmware (firmware/obc-pico2). Wiring: hardware/WIRING.md (GP0/GP1 on the Pico <-> UART here).

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

# Optional: lets Home Assistant reach a Bluetooth adjustable base (ha-adjustable-bed).
bluetooth_proxy:
  active: true

uart:
  id: opl_uart
  tx_pin: GPIO17   # -> Pico 2 GP1 (UART0 RX)
  rx_pin: GPIO18   # <- Pico 2 GP0 (UART0 TX)
  baud_rate: 460800
  rx_buffer_size: 1024

obc:
  id: pod
  uart_id: opl_uart
  # Recommended: room sensors enable the dew-point guard (cooling below 16 °C never goes under
  # dew point + 1 K, so the mat and lines don't sweat). E.g. an SHT45 on the hub's I2C bus:
  # room_temperature: room_t
  # room_humidity: room_rh

climate:
  - platform: obc
    id: left
    zone: 0
    name: Left side
  - platform: obc
    id: right
    zone: 1
    name: Right side

# Night programs run on the hub itself (no Home Assistant needed once started).
# Turn the switch on at bedtime; with a wake time the zone warms up and turns off at that time.
time:
  - platform: homeassistant
    id: hub_time
  # or: - platform: sntp

datetime:
  - platform: template
    id: left_wake
    type: time
    name: Left wake time
    optimistic: true
    restore_value: true
    initial_value: "07:00"
  - platform: template
    id: right_wake
    type: time
    name: Right wake time
    optimistic: true
    restore_value: true
    initial_value: "07:00"

switch:
  - platform: obc
    name: Left night program
    climate_id: left
    time_id: hub_time
    wake_time: left_wake
    # Default curve (same as obc.schedule.DEFAULT); every point is optional to change.
    points:
      - { at: 0min, temperature: 24 }
      - { at: 30min, temperature: 21 }
      - { at: 120min, temperature: 20 }
      - { at: 300min, temperature: 23 }
      - { at: 420min, temperature: 25 }
    wake_ramp: 30min
    wake_temperature: 32
  - platform: obc
    name: Right night program
    climate_id: right
    time_id: hub_time
    wake_time: right_wake

sensor:
  - platform: obc
    zone: 0
    water_temperature:
      name: Left water temperature
      filters:
        - throttle_average: 30s
    hot_face_temperature:
      name: Left heatsink temperature
      filters:
        - throttle_average: 30s
    tec_current:
      name: Left TEC current
      filters:
        - throttle_average: 30s
    flow:
      name: Left flow
      filters:
        - throttle_average: 30s
    fault_code:
      name: Left fault code
      filters:
        - delta: 1
  - platform: obc
    zone: 1
    water_temperature:
      name: Right water temperature
      filters:
        - throttle_average: 30s
    hot_face_temperature:
      name: Right heatsink temperature
      filters:
        - throttle_average: 30s
    tec_current:
      name: Right TEC current
      filters:
        - throttle_average: 30s
    flow:
      name: Right flow
      filters:
        - throttle_average: 30s
    fault_code:
      name: Right fault code
      filters:
        - delta: 1

binary_sensor:
  - platform: obc
    link:
      name: Control board link
  - platform: obc
    zone: 0
    fault:
      name: Left problem
  - platform: obc
    zone: 1
    fault:
      name: Right problem

button:
  - platform: obc
    prime:
      name: Prime water loop
  - platform: obc
    zone: 0
    clear_faults:
      name: Left clear faults
  - platform: obc
    zone: 1
    clear_faults:
      name: Right clear faults
