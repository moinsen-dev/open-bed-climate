[project]
name = "obc"
version = "0.1.0"
description = "Open Bed Climate: reference models, control logic and protocol for an open-source water-based bed climate system"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obc"]
