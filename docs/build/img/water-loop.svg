<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="none">
  <title>Bench water loop (stage A)</title>
  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
  </defs>

  <text x="20" y="28" fill="#8b95a7" font-size="16" font-weight="600">Bench water loop (stage A) · a tube coil in a 10 L bath stands in for the mat</text>

  <!-- return line label and NTC -->
  <rect x="380" y="50" width="60" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="410" y="66" fill="#f59e0b" text-anchor="middle" font-size="11" font-weight="600">NTC</text>
  <text x="410" y="94" fill="#8b95a7" text-anchor="middle" font-size="12">water NTC (A0), return line</text>
  <text x="560" y="54" fill="#38bdf8" font-size="12">return</text>

  <!-- reservoir -->
  <rect x="60" y="86" width="90" height="150" rx="4" stroke="#8b95a7" stroke-width="1.5"/>
  <rect x="61" y="112" width="88" height="123" fill="#38bdf8" fill-opacity="0.15"/>
  <line x1="61" y1="112" x2="149" y2="112" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="72" y="76" width="22" height="10" fill="#8b95a7" fill-opacity="0.3" stroke="#8b95a7" stroke-width="1"/>
  <text x="54" y="72" fill="#8b95a7" font-size="11" text-anchor="end">fill port</text>
  <rect x="150" y="180" width="12" height="22" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="168" y="188" fill="#ef4444" font-size="12">level sensor → GP22</text>
  <text x="168" y="204" fill="#ef4444" font-size="12">(~1/3 height)</text>
  <text x="98" y="254" fill="#8b95a7" text-anchor="end" font-size="12">reservoir</text>
  <text x="98" y="268" fill="#8b95a7" text-anchor="end" font-size="11">only free surface</text>

  <!-- reservoir -> pump -->
  <line x1="105" y1="236" x2="105" y2="290" stroke="#38bdf8" stroke-width="3" marker-end="url(#ac)"/>
  <!-- pump -->
  <circle cx="105" cy="322" r="30" fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="1.5"/>
  <text x="105" y="326" fill="#8b95a7" text-anchor="middle" font-weight="600">pump</text>
  <text x="105" y="370" fill="#8b95a7" text-anchor="middle" font-size="12">GP12</text>
  <!-- pump -> flow -->
  <line x1="135" y1="322" x2="186" y2="322" stroke="#38bdf8" stroke-width="3" marker-end="url(#ac)"/>
  <rect x="190" y="306" width="74" height="32" rx="4" fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="1.5"/>
  <text x="227" y="326" fill="#8b95a7" text-anchor="middle" font-size="12" font-weight="600">flow</text>
  <text x="227" y="356" fill="#8b95a7" text-anchor="middle" font-size="12">GP14</text>

  <!-- cold plates -->
  <line x1="264" y1="322" x2="296" y2="322" stroke="#38bdf8" stroke-width="3" marker-end="url(#ac)"/>
  <rect x="300" y="302" width="60" height="40" rx="3" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="360" y1="322" x2="386" y2="322" stroke="#38bdf8" stroke-width="3" marker-end="url(#ac)"/>
  <rect x="390" y="302" width="60" height="40" rx="3" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="450" y1="322" x2="476" y2="322" stroke="#38bdf8" stroke-width="3" marker-end="url(#ac)"/>
  <rect x="480" y="302" width="60" height="40" rx="3" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
  <g fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5">
    <rect x="300" y="342" width="60" height="22" rx="2"/>
    <rect x="390" y="342" width="60" height="22" rx="2"/>
    <rect x="480" y="342" width="60" height="22" rx="2"/>
  </g>
  <g fill="#8b95a7" text-anchor="middle" font-size="12">
    <text x="330" y="326">plate 1</text><text x="420" y="326">plate 2</text><text x="510" y="326">plate 3</text>
  </g>
  <text x="420" y="384" fill="#f59e0b" text-anchor="middle" font-size="12">TEC + heatsink under each plate (in series)</text>

  <!-- supply line: plate 3 -> coil inlet -->
  <polyline points="540,322 600,322 600,124 700,124 700,350" stroke="#38bdf8" stroke-width="3"/>
  <text x="608" y="116" fill="#38bdf8" font-size="12">supply</text>

  <!-- insulated cool box with bath -->
  <rect x="650" y="150" width="225" height="245" rx="8" stroke="#8b95a7" stroke-width="5" stroke-dasharray="10 6"/>
  <line x1="650" y1="168" x2="875" y2="168" stroke="#8b95a7" stroke-width="2"/>
  <rect x="660" y="200" width="205" height="186" fill="#38bdf8" fill-opacity="0.10"/>
  <line x1="660" y1="200" x2="865" y2="200" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- coil: loops at the bottom -->
  <path d="M700,350 C700,372 840,372 840,350 C840,330 712,330 712,350 C712,364 828,364 828,346 C828,338 724,338 724,352 C724,358 790,358 790,352" stroke="#38bdf8" stroke-width="3"/>
  <polyline points="790,352 790,380 852,380 852,62 120,62 120,86" stroke="#38bdf8" stroke-width="3" marker-end="url(#ac)"/>
  <text x="770" y="222" fill="#38bdf8" text-anchor="middle" font-weight="600">10 L bath</text>
  <text x="770" y="240" fill="#8b95a7" text-anchor="middle" font-size="11">tap water, not in the loop</text>
  <text x="810" y="300" fill="#8b95a7" text-anchor="middle" font-size="11">5 m tube</text>
  <text x="810" y="314" fill="#8b95a7" text-anchor="middle" font-size="11">coil</text>
  <circle cx="735" cy="280" r="6" fill="#8b95a7" fill-opacity="0.3" stroke="#8b95a7" stroke-width="1.5"/>
  <text x="726" y="296" fill="#8b95a7" text-anchor="end" font-size="11">bath probe</text>
  <text x="762" y="414" fill="#8b95a7" text-anchor="middle" font-size="12">insulated cool box with lid</text>

  <!-- drip tray + leak cable -->
  <polyline points="30,400 30,470 620,470 620,400" stroke="#8b95a7" stroke-width="2"/>
  <line x1="40" y1="462" x2="610" y2="462" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="40" y="452" fill="#ef4444" font-size="12">leak cable on the tray floor, under pump, plates, fittings → GP21</text>
  <text x="40" y="490" fill="#8b95a7" font-size="12">drip tray under all hub-side wet parts · electronics outside / above it · reservoir above the pump inlet</text>
</svg>
