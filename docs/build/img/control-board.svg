<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="none">
  <title>Control board block wiring (Solo Starter, zone 0)</title>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b95a7"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>

  <text x="20" y="28" fill="#8b95a7" font-size="16" font-weight="600">Control board, block wiring · Solo Starter uses zone 0 only (GP16–GP20 unconnected)</text>

  <!-- Pico -->
  <rect x="380" y="100" width="200" height="380" rx="8" fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="2"/>
  <text x="480" y="290" fill="#8b95a7" text-anchor="middle" font-size="16" font-weight="600">Pico 2</text>
  <text x="480" y="308" fill="#8b95a7" text-anchor="middle" font-size="12">control_mcu</text>
  <g fill="#8b95a7" font-size="12">
    <text x="388" y="144">GP0 TX / GP1 RX</text>
    <text x="388" y="204">GP4 / GP5 / GP6</text>
    <text x="388" y="264">GP8 SDA / GP9 SCL</text>
    <text x="388" y="344">VSYS</text>
    <text x="388" y="394">3V3 OUT</text>
    <text x="388" y="444">GND</text>
  </g>
  <g fill="#8b95a7" font-size="12" text-anchor="end">
    <text x="572" y="134">GP10</text>
    <text x="572" y="184">GP11</text>
    <text x="572" y="234">GP12</text>
    <text x="572" y="284">GP13</text>
    <text x="572" y="354">GP14</text>
    <text x="572" y="404">GP21</text>
    <text x="572" y="454">GP22</text>
  </g>

  <!-- left: hub -->
  <rect x="150" y="118" width="120" height="40" rx="5" fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="1.5"/>
  <text x="210" y="136" fill="#8b95a7" text-anchor="middle" font-weight="600">ESP32-S3</text>
  <text x="210" y="151" fill="#8b95a7" text-anchor="middle" font-size="11">hub_controller</text>
  <line x1="270" y1="140" x2="380" y2="140" stroke="#8b95a7" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="276" y="132" fill="#8b95a7" font-size="11">OPL, 460 800 Bd</text>
  <text x="20" y="136" fill="#8b95a7" font-size="11">GPIO17 → GP1</text>
  <text x="20" y="151" fill="#8b95a7" font-size="11">GPIO18 ← GP0</text>

  <!-- left: RS-485 -->
  <rect x="20" y="180" width="100" height="40" rx="5" fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="1.5"/>
  <text x="70" y="198" fill="#8b95a7" text-anchor="middle" font-weight="600">DPS5020</text>
  <text x="70" y="213" fill="#8b95a7" text-anchor="middle" font-size="11">+ RS-485 adapter</text>
  <rect x="150" y="180" width="120" height="40" rx="5" fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="1.5"/>
  <text x="210" y="198" fill="#8b95a7" text-anchor="middle" font-weight="600">RS-485</text>
  <text x="210" y="213" fill="#8b95a7" text-anchor="middle" font-size="11">3.3 V transceiver</text>
  <line x1="120" y1="200" x2="150" y2="200" stroke="#8b95a7" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="122" y="236" fill="#8b95a7" font-size="11">A/B, 120 Ω both ends</text>
  <line x1="270" y1="200" x2="380" y2="200" stroke="#8b95a7" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="276" y="192" fill="#8b95a7" font-size="11">DI / RO / DE+RE</text>

  <!-- left: ADS -->
  <rect x="10" y="244" width="130" height="56" rx="5" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="75" y="262" fill="#f59e0b" text-anchor="middle" font-size="12" font-weight="600">NTC dividers</text>
  <text x="75" y="277" fill="#8b95a7" text-anchor="middle" font-size="10">3.3 V–10 kΩ–node–NTC</text>
  <text x="75" y="291" fill="#8b95a7" text-anchor="middle" font-size="10">A0 water · A1 hot side</text>
  <rect x="150" y="246" width="120" height="40" rx="5" fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="1.5"/>
  <text x="210" y="264" fill="#8b95a7" text-anchor="middle" font-weight="600">ADS1115</text>
  <text x="210" y="279" fill="#8b95a7" text-anchor="middle" font-size="11">0x48, ADDR → GND</text>
  <line x1="140" y1="266" x2="146" y2="266" stroke="#8b95a7" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="270" y1="260" x2="380" y2="260" stroke="#8b95a7" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="276" y="252" fill="#8b95a7" font-size="11">I2C0</text>

  <!-- left: power -->
  <rect x="20" y="320" width="100" height="40" rx="5" fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="1.5"/>
  <text x="70" y="338" fill="#8b95a7" text-anchor="middle" font-weight="600">12 V</text>
  <text x="70" y="353" fill="#8b95a7" text-anchor="middle" font-size="11">aux_psu</text>
  <rect x="150" y="320" width="120" height="40" rx="5" fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="1.5"/>
  <text x="210" y="338" fill="#8b95a7" text-anchor="middle" font-weight="600">buck → 5.0 V</text>
  <text x="210" y="353" fill="#8b95a7" text-anchor="middle" font-size="11">also feeds ESP32 5V</text>
  <line x1="120" y1="340" x2="146" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#aa)"/>
  <line x1="270" y1="340" x2="310" y2="340" stroke="#f59e0b" stroke-width="2"/>
  <!-- schottky -->
  <path d="M310,330 L310,350 L328,340 Z" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
  <polyline points="324,330 328,330 328,350 332,350" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="328" y1="340" x2="380" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#aa)"/>
  <text x="296" y="372" fill="#f59e0b" font-size="11">Schottky</text>
  <line x1="380" y1="390" x2="280" y2="390" stroke="#8b95a7" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="20" y="386" fill="#8b95a7" font-size="11">3.3 V → ADS1115, NTC dividers,</text>
  <text x="20" y="400" fill="#8b95a7" font-size="11">transceiver, leak/level pull-ups</text>
  <line x1="380" y1="440" x2="280" y2="440" stroke="#8b95a7" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="20" y="444" fill="#8b95a7" font-size="11">GND: one wire to the star point</text>
  <text x="20" y="476" fill="#ef4444" font-size="12" font-weight="600">Never 12 V on VSYS or any GPIO.</text>

  <!-- right: output drivers -->
  <g stroke="#8b95a7" stroke-width="1.5">
    <line x1="580" y1="130" x2="636" y2="130" marker-end="url(#ag)"/>
    <line x1="580" y1="180" x2="636" y2="180" marker-end="url(#ag)"/>
    <line x1="580" y1="230" x2="636" y2="230" marker-end="url(#ag)"/>
    <line x1="580" y1="280" x2="636" y2="280" marker-end="url(#ag)"/>
  </g>
  <g fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="1.5">
    <rect x="640" y="114" width="80" height="32" rx="4"/>
    <rect x="640" y="164" width="80" height="32" rx="4"/>
    <rect x="640" y="214" width="80" height="32" rx="4"/>
    <rect x="640" y="264" width="80" height="32" rx="4"/>
  </g>
  <g fill="#8b95a7" text-anchor="middle" font-size="11">
    <text x="680" y="134">MOSFET</text><text x="680" y="184">MOSFET</text>
    <text x="680" y="234">MOSFET</text><text x="680" y="284">MOSFET</text>
  </g>
  <!-- pull-down marks -->
  <g stroke="#ef4444" stroke-width="1.5">
    <line x1="610" y1="130" x2="610" y2="146"/><rect x="606" y="146" width="8" height="10" fill="#ef4444" fill-opacity="0.2"/>
    <line x1="610" y1="180" x2="610" y2="196"/><rect x="606" y="196" width="8" height="10" fill="#ef4444" fill-opacity="0.2"/>
    <line x1="610" y1="230" x2="610" y2="246"/><rect x="606" y="246" width="8" height="10" fill="#ef4444" fill-opacity="0.2"/>
    <line x1="610" y1="280" x2="610" y2="296"/><rect x="606" y="296" width="8" height="10" fill="#ef4444" fill-opacity="0.2"/>
  </g>
  <g stroke="#8b95a7" stroke-width="1.5">
    <line x1="720" y1="130" x2="746" y2="130" marker-end="url(#ag)"/>
    <line x1="720" y1="180" x2="746" y2="180" marker-end="url(#ag)"/>
    <line x1="720" y1="230" x2="746" y2="230" marker-end="url(#ag)"/>
    <line x1="720" y1="280" x2="746" y2="280" marker-end="url(#ag)"/>
  </g>
  <g fill="#8b95a7" font-size="12">
    <text x="752" y="126" fill="#ef4444" font-weight="600">zone relay coil</text>
    <text x="752" y="141" font-size="11">+12 V through the cutoff chain</text>
    <text x="752" y="176" font-weight="600">polarity relay coil</text>
    <text x="752" y="191" font-size="11">low = cool, high = heat</text>
    <text x="752" y="234" font-weight="600">pump (12 V)</text>
    <text x="752" y="284" font-weight="600">heatsink fans (12 V)</text>
  </g>
  <text x="600" y="318" fill="#ef4444" font-size="11">4.7 kΩ gate pull-down on every driver (E9)</text>
  <text x="600" y="92" fill="#8b95a7" font-size="11">flyback diode across every coil, the pump and the fans</text>

  <!-- right: inputs -->
  <g stroke="#8b95a7" stroke-width="1.5">
    <line x1="640" y1="350" x2="584" y2="350" marker-end="url(#ag)"/>
    <line x1="640" y1="400" x2="584" y2="400" marker-end="url(#ag)"/>
    <line x1="640" y1="450" x2="584" y2="450" marker-end="url(#ag)"/>
  </g>
  <g fill="#8b95a7" fill-opacity="0.08" stroke="#8b95a7" stroke-width="1.5">
    <rect x="640" y="334" width="110" height="32" rx="4"/>
    <rect x="640" y="384" width="110" height="32" rx="4" stroke="#ef4444"/>
    <rect x="640" y="434" width="110" height="32" rx="4" stroke="#ef4444"/>
  </g>
  <g fill="#8b95a7" text-anchor="middle" font-size="12" font-weight="600">
    <text x="695" y="354">flow sensor</text>
    <text x="695" y="404" fill="#ef4444">leak sensor</text>
    <text x="695" y="454" fill="#ef4444">level sensor</text>
  </g>
  <g fill="#8b95a7" font-size="11">
    <text x="758" y="347">open collector, internal pull-up;</text>
    <text x="758" y="361">divide down if it pulls up to 5 V</text>
    <text x="758" y="397">10 kΩ pull-up · LOW = dry</text>
    <text x="758" y="411">HIGH = leak or broken wire</text>
    <text x="758" y="447">10 kΩ pull-up · LOW = level OK</text>
    <text x="758" y="461">HIGH = low or broken wire</text>
  </g>
  <text x="380" y="520" fill="#ef4444" font-size="12">Red = fail-safe parts: a dead Pico leaves every output off; a broken wire reads as a fault.</text>
</svg>
