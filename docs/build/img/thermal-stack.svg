<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="none">
  <title>Thermal stack, side view (one TEC, cooling mode)</title>
  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b95a7"/></marker>
  </defs>

  <text x="20" y="28" fill="#8b95a7" font-size="16" font-weight="600">Thermal stack, side view · one of three TECs, cooling mode (polarity relay off)</text>

  <!-- water ports -->
  <rect x="165" y="80" width="20" height="30" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="335" y="80" width="20" height="30" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="175" y1="52" x2="175" y2="78" stroke="#38bdf8" stroke-width="2" marker-end="url(#ac)"/>
  <line x1="345" y1="78" x2="345" y2="52" stroke="#38bdf8" stroke-width="2" marker-end="url(#ac)"/>
  <text x="140" y="48" fill="#38bdf8" font-size="12">water in</text>
  <text x="330" y="48" fill="#38bdf8" font-size="12">water out</text>

  <!-- cold plate -->
  <rect x="140" y="110" width="240" height="50" rx="3" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="260" y="140" fill="#38bdf8" text-anchor="middle" font-weight="600">cold plate</text>

  <!-- 50 C cutoff on plate -->
  <rect x="228" y="94" width="44" height="16" rx="2" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="250" y="106" fill="#ef4444" text-anchor="middle" font-size="10" font-weight="600">50 °C</text>

  <!-- paste -->
  <rect x="200" y="160" width="120" height="4" fill="#8b95a7" fill-opacity="0.6"/>
  <!-- foam frame -->
  <rect x="140" y="160" width="60" height="38" fill="#8b95a7" fill-opacity="0.18" stroke="#8b95a7" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="320" y="160" width="60" height="38" fill="#8b95a7" fill-opacity="0.18" stroke="#8b95a7" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- TEC -->
  <rect x="200" y="164" width="120" height="30" fill="#8b95a7" fill-opacity="0.10" stroke="#8b95a7" stroke-width="1.5"/>
  <line x1="200" y1="165" x2="320" y2="165" stroke="#38bdf8" stroke-width="3"/>
  <line x1="200" y1="193" x2="320" y2="193" stroke="#f59e0b" stroke-width="3"/>
  <text x="260" y="184" fill="#8b95a7" text-anchor="middle" font-size="12" font-weight="600">TEC</text>
  <!-- paste -->
  <rect x="200" y="194" width="120" height="4" fill="#8b95a7" fill-opacity="0.6"/>

  <!-- heatsink base and fins -->
  <rect x="110" y="198" width="300" height="30" rx="2" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <g stroke="#f59e0b" stroke-width="2">
    <line x1="122" y1="228" x2="122" y2="336"/><line x1="140" y1="228" x2="140" y2="336"/>
    <line x1="158" y1="228" x2="158" y2="336"/><line x1="176" y1="228" x2="176" y2="336"/>
    <line x1="194" y1="228" x2="194" y2="336"/><line x1="212" y1="228" x2="212" y2="336"/>
    <line x1="230" y1="228" x2="230" y2="336"/><line x1="248" y1="228" x2="248" y2="336"/>
    <line x1="266" y1="228" x2="266" y2="336"/><line x1="284" y1="228" x2="284" y2="336"/>
    <line x1="302" y1="228" x2="302" y2="336"/><line x1="320" y1="228" x2="320" y2="336"/>
    <line x1="338" y1="228" x2="338" y2="336"/><line x1="356" y1="228" x2="356" y2="336"/>
    <line x1="374" y1="228" x2="374" y2="336"/><line x1="392" y1="228" x2="392" y2="336"/>
  </g>
  <!-- fan -->
  <rect x="110" y="342" width="300" height="26" rx="4" fill="#8b95a7" fill-opacity="0.10" stroke="#8b95a7" stroke-width="1.5"/>
  <text x="260" y="360" fill="#8b95a7" text-anchor="middle" font-size="12" font-weight="600">fan</text>
  <line x1="200" y1="398" x2="200" y2="372" stroke="#8b95a7" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="320" y1="398" x2="320" y2="372" stroke="#8b95a7" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="260" y="414" fill="#8b95a7" text-anchor="middle" font-size="12">airflow through the fins</text>

  <!-- 80 C cutoff on base side -->
  <rect x="94" y="203" width="16" height="20" rx="2" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="88" y="217" fill="#ef4444" text-anchor="end" font-size="12" font-weight="600">80 °C</text>
  <!-- hot side NTC -->
  <circle cx="417" cy="213" r="6" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- screws + springs -->
  <g stroke="#8b95a7" stroke-width="2">
    <line x1="150" y1="70" x2="150" y2="220"/>
    <line x1="370" y1="70" x2="370" y2="220"/>
    <line x1="142" y1="70" x2="158" y2="70"/>
    <line x1="362" y1="70" x2="378" y2="70"/>
  </g>
  <polyline points="150,74 158,78 142,84 158,90 142,96 158,102 150,106" stroke="#8b95a7" stroke-width="1.5"/>
  <polyline points="370,74 378,78 362,84 378,90 362,96 378,102 370,106" stroke="#8b95a7" stroke-width="1.5"/>

  <!-- leader lines and labels -->
  <g stroke="#8b95a7" stroke-width="1">
    <line x1="380" y1="74" x2="470" y2="74"/>
    <line x1="272" y1="102" x2="470" y2="102"/>
    <line x1="380" y1="135" x2="470" y2="135"/>
    <line x1="380" y1="170" x2="470" y2="166"/>
    <line x1="320" y1="180" x2="470" y2="188"/>
    <line x1="424" y1="213" x2="470" y2="213"/>
    <line x1="410" y1="282" x2="470" y2="282"/>
    <line x1="410" y1="355" x2="470" y2="355"/>
  </g>
  <g fill="#8b95a7" font-size="13">
    <text x="476" y="78">threaded rod + spring + insulating washer (to bracket/backplate)</text>
    <text x="476" y="106" fill="#ef4444">50 °C NC cutoff on every cold plate (coil chain)</text>
    <text x="476" y="139" fill="#38bdf8">cold plate (cold_plate), wrapped in foam</text>
    <text x="476" y="170">foam frame around the TEC, thin paste both faces</text>
    <text x="476" y="192"><tspan fill="#38bdf8">cold face up</tspan> / <tspan fill="#f59e0b">hot face down</tspan>, red lead = +</text>
    <text x="476" y="217" fill="#f59e0b">hot-side NTC on the heatsink base (ADS A1)</text>
    <text x="476" y="286" fill="#f59e0b">heatsink (heatsink), Solo target ≤ 0.11 K/W per zone</text>
    <text x="476" y="359">12 V fans, switched by GP13</text>
  </g>
  <text x="20" y="250" fill="#ef4444" font-size="12">80 °C NC cutoff</text>
  <text x="20" y="266" fill="#ef4444" font-size="12">on every heatsink</text>
  <text x="476" y="400" fill="#8b95a7" font-size="12">Heating mode swaps the faces: the plate side gets hot,</text>
  <text x="476" y="416" fill="#8b95a7" font-size="12">the heatsink side cold (it can sweat).</text>
</svg>
