      specs: {license: "GPL-3.0; 157 stars; updated 2026-03-28", architecture: "SOM (i.MX8M Mini) + STM32 'Frozen' (2 TEC PID, 2 pumps, solenoid, level sensor) + STM32 sensor board (6 capacitance sensors, 8 bed NTCs, 2 piezo at ~500 Hz, vibration motors)"}
      source: "https://github.com/LiamSnow/opensleep"
      retailer: "https://github.com/LiamSnow/opensleep/blob/main/BACKGROUND.md"
      verified_on: 2026-10-10
      notes: "GPL-3.0 and reverse-engineered protocol - a clean-room Open Bed Climate should not copy code from it; its BACKGROUND.md is only a hardware-architecture reference."
    - name: "bobobo1618/ninesleep and throwaway31265/free-sleep (Pod 3/4/5 local control)"
      specs: {free-sleep: "MIT; local REST server on the Pod; Pod 1/2 incompatible", ninesleep: "replaces dac process; immature; still uploads data unless blocked"}
      source: "https://github.com/throwaway31265/free-sleep"
      retailer: "https://github.com/bobobo1618/ninesleep"
      verified_on: 2026-10-10
      notes: "Pod-control hacks, not DIY cooler builds."
    - name: "Other references"
      specs: {makezine: "thermoelectrically cooled pillow (water bladder, 6 temp sensors, Arduino)", thai_paper: "water temperature control for temperature-controlled mattress (Peltier)", element14: "BenHeck viewer challenge 'water-cooled blanket'", ifixit: "user ~USD 50 TEC1-12706 chiller clone, 'cools slowly'"}
      source: "https://makezine.com/article/home/my-thermoelectrically-cooled-pillow/"
      retailer: "https://ph02.tci-thaijo.org/index.php/swujournal/article/view/251605"
      verified_on: 2026-10-10
      notes: "Reddit search returned no usable threads."
  findings: |
    Three real DIY builds found; none shows measured cooling performance, one (opencooler V1) documented a failed test. Common themes: PWM drive of TECs (all three), D5/DDC pumps with 25 kHz PWM,
    DS18B20 for heatsink protection, separate hot-side loop/radiator beats a tower on a block, leaks and noise are the practical killers, and 4 mm tubing is a comfort/size trade-off.
    Commercial opensleep architecture (dedicated MCU for TEC/pump/safety, separate sensor MCU) matches the planned ESP32 + Pico split.
