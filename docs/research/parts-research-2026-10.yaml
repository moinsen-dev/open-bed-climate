      specs: {parts: "4 TEC, 4x 30 A automotive relays (MOSFETs overheated), L+C per TEC, 6 ohm 50 W headlight-bulb load resistors for current limiting, PC PSU, Phanteks Glacier R260C + D5, FeatherS3 ESP32-S3 on ESPHome with custom JLCPCB board, 30 m 4 mm ID tubing in foam topper"}
      source: "https://techteamgb.co.uk/2024/11/18/i-made-a-custom-bed-watercooler-open-source-diy-bed-cooler-heater-eight-sleep-type-thing/"
      verified_on: 2026-10-10
