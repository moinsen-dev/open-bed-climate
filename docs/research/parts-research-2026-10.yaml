        parts: "4x TEC (12703/12706/12715 tried; '127106FX' water-sealed variant in BOM), 4x Cytron MD13S PWM/DIR drivers, D5 pump (PWM 25 kHz + tach), XKC-Y26 non-contact water-level sensor, DS18B20 heatsink probes, 10k NTC coolant probe, ST7789 TFT, Pi Pico 2 also mentioned; Mean Well PSU (~300 W est.)"
        design: "single cooler for one mattress, no valves, no separate hot/cold reservoirs; pump dry-run interlock; web UI + JSON API"
      source: "https://github.com/opensleep/opencooler"
      retailer: "https://hackaday.io/project/205182-opencooler"
      verified_on: 2026-10-10
      notes: "Lessons (hackaday log, June 2026 V1 test): FAILED test (one TEC side warm, other barely chilled); MD13S capacitors ran hot; splitters melted at high draw; pump at 100 % too loud; reservoir leaks; do not mix Al/Cu; tower layout with gravity-fed pump simpler; project paused. Teardown thread: r/EightSleep (linked from the Hackaday page). Uses PWM drive - contradicts the smooth-DC requirement."
    - name: "jojaritz/smart-water-cooled-bed-controller"
      specs:
        license: "MIT; updated 2026-08-28; 1 star"
        parts: "ESP32-WROOM, Mean Well LRS-340-12 (12 V 29 A), 4x TEC1-12706 parallel, 4x IRLZ44N low-side MOSFETs, 2x DS18B20, 2x DDC PWM pumps (25 kHz), 360 mm radiator on separate hot loop, KiCad PCB with 7.5 A fuses"
        safety: "55 C hot-loop trip, 1-Wire disconnect -> stop, +-0.5 C hysteresis"
      source: "https://github.com/jojaritz/smart-water-cooled-bed-controller"
      verified_on: 2026-10-10
