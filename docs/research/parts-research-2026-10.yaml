- role: controller
  requirement: "ESP32-S3 (ESPHome), Pico 2 (RP2350) as separate safety MCU; compiled-in constants not changeable via YAML."
  examples:
    - name: "Espressif ESP32-S3-DevKitC-1 (ESP32-S3-WROOM-1/1U/2)"
      specs: {esphome: "board: esp32-s3-devkitc-1, framework esp-idf (working YAML seen on KinCony forum)"}
      source: "https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32s3/esp32-s3-devkitc-1/user_guide.html"
      retailer: "https://core-electronics.com.au/esp32-s3-devkitc-1-n8r8-esp32-s3-wroom-1-8mb-flash-8mb-psram.html"
      verified_on: 2026-10-10
      notes: "ESPHome board support confirmed only by a community YAML, not by ESPHome docs page."
    - name: "Raspberry Pi Pico 2 (RP2350)"
      specs: {cpu: "dual Cortex-M33 or Hazard3 RISC-V, 150 MHz", sram: "520 KB", flash: "4 MB", adc: "12-bit, 500 kS/s", price: "USD 5.00 (DigiKey SC1631)", watchdog: "not verified"}
      source: "https://pip-assets.raspberrypi.com/categories/1005-raspberry-pi-pico-2/documents/RP-008299-DS-3-pico-2-datasheet.pdf"
      retailer: "https://www.digikey.com/en/products/detail/raspberry-pi/SC1631/24627142"
      verified_on: 2026-10-10
      notes: "Opencooler author uses a Pico 2 with a flow sensor."
  findings: |
    ESPHome external_components supports a LOCAL source (source: my_components / type: local, path: relative to the YAML), with a C++ __init__.py + .cpp/.h per component (ESPHome docs).
    The docs page says nothing on compile-time constants; keeping safety limits (max current, over-temp, max duty) as C++ constexpr inside a custom component that does not expose them in its config schema is a design inference (feasible, not documented as a feature).
    Use the Pico 2 as an independent watchdog/safety MCU (hardware cutoff via relay), reading its own NTC + flow tach and holding the TEC enable line.

- role: bcg_sensing
  requirement: "Heart rate / respiration from bed: piezo film + ADC, load cells, pneumatic, and existing ESPHome presence projects."
  examples:
    - name: "(a) TE Connectivity LDT0-028K piezo film (+ SDT1 shock-type)"
      specs: {film: "28 um PVDF, 0.125 mm polyester, silver-ink electrodes", temp: "0-85 C", note: "capacitance/sensitivity not extracted (datasheet content not retrieved)"}
      source: "https://www.farnell.com/datasheets/3965669.pdf"
      retailer: "https://jp.farnell.com/en-JP/sensor-solutions-te-connectivity/ldt0-028k/piezoelectric-sensor-voltage/dp/2771930"
      verified_on: 2026-10-10
      notes: "Very high source impedance: needs a buffer/charge amp in front of an ADC (inference)."
    - name: "(a) TI ADS131M08 (+ ADS131M08EVM)"
      specs: {channels: "8 simultaneous, 24-bit, up to 32 kSPS", interface: "SPI", supply: "2.7-3.6 V analog", package: "TQFP-32 / WQFN-32"}
      source: "https://www.ti.com/product/ADS131M08"
      verified_on: 2026-10-10
      notes: "No off-the-shelf hobby breakout found in this pass; TI EVM exists (price not on page)."
    - name: "(a) ADS1299 / OpenBCI Cyton"
      specs: {adc: "8 ch, 24-bit, 250 SPS to 16 kSPS", cyton: "8 differential channels, gain 1-24", daisy: "US shop listed USD 1,249, sold out; chip about EUR 63 (Farnell)"}
      source: "https://shop.openbci.com/products/cyton-daisy-biosensing-boards-16-channel"
      verified_on: 2026-10-10
      notes: "Biopotential AFE (EEG), awkward for piezo; expensive. ADS1298 not checked."
    - name: "(b) HX711 / NAU7802 / ADS1232 under bed legs"
      specs: {HX711: "10 or 80 SPS, fixed by RATE pin wiring (Klipper docs)", NAU7802: "10/20/40/80/320 SPS; one SparkFun user measured ~1/9 of nominal rate", ADS1232: "not verified"}
      source: "https://community.sparkfun.com/t/nau7802-sampling-rate/41059"
      verified_on: 2026-10-10
      notes: "HX711 flaky at 3.3 V (one HA thread)."
    - name: "(c) Pneumatic tube / air bladder + pressure sensor (XGZP6847, MPRLS, Honeywell ABP)"
      specs: {note: "No datasheet/DIY evidence retrieved for these three sensors"}
      source: "https://doaj.org/article/aa0acc60ad3748178aa63cd2062f426e"
      verified_on: 2026-10-10
      notes: "Heliyon 2023 (Lin et al.): air-mattress system for BCG heart-rate and breathing-rate estimation."
    - name: "(d) ESPHome / MQTT bed presence projects"
      specs: {projects: "HA forum 'Bed Scale / Occupancy sensor' (ESPHome + HX711 on WeMos D1 mini); geelenbert/LoadCellOccupany (ATmega328 + ethernet); belangp/mqtt-bed-sensor; jpralves.net 2019 build"}
      source: "https://community.home-assistant.io/t/bed-scale-occupancy-sensor/114205"
      retailer: "https://github.com/belangp/mqtt-bed-sensor"
      verified_on: 2026-10-10
      notes: "Presence only, ~1 Hz updates. Eight Sleep Pod 3 uses 6 capacitance sensors at ~2 Hz for presence (opensleep BACKGROUND.md)."
  findings: |
    (a) Strongest real-world evidence: the Eight Sleep Pod 3 samples 2 piezo sensors at ~500 Hz via an ADC read by an STM32 (opensleep BACKGROUND.md, reverse-engineering notes, GPL repo).
    9 ch x 500 Hz = 4.5 kS/s, ~15 kB/s on a 30-byte ADS131M08 frame (inference): trivial for an ESP32-S3 or Pico over SPI with DRDY interrupts; internal ESP32 ADCs are not suitable (inference).
    (b) HX711 at 80 SPS: Nyquist-adequate for heart rate (fundamental ~1-2 Hz); literature downsampled BCG to 50 Hz for HR algorithms (arXiv 2101.09144) and used 200 Hz on a chair (PMC9337676). Load-cell bed BCG with off-the-shelf load cells: PMC6470700 (Sensors 2019) and infant bed PMC4813984 (HR error 2.55 %); the full-text sample rate/ADC could not be fetched (captcha). An HX711 cushion project reports MAE 3.07 BPM (19 samples, 2 subjects, not peer reviewed). Risks: HX711 anti-alias filter undocumented, 24-bit noise, mattress compliance.
    (c) Withings Sleep Analyzer: under-mattress 'pneumatic sensor' + sound sensor, BCG-based, CE-marked (Withings support PDF/reviews); Withings told reviewers it may not work on waterbeds - relevant to a water mat. Papers: Heliyon 2023 air mattress; Willemen et al. air-pressure BCG; Watanabe (cited in arXiv 1807.00951); a patent samples ~100 Hz. XGZP6847/MPRLS/ABP suitability unverified.
    (d) See above; opensleep (GPL-3.0) shows capacitive presence + piezo HR is the commercial architecture.

