# Open Bed Climate - off-the-shelf parts verification
# verified_on: 2026-10-10. Method: web search + page/PDF fetch + `gh api`.
# Convention: values marked "(unverified)" or "(inference)" were NOT confirmed against a primary source.
# Prices are only given where a source was seen; otherwise "price: not verified".
# Many retailer/manufacturer pages could not be fetched (HTTP 403/406/captcha); those are called out.

- role: psu_12v
  requirement: "Certified 12 V >=600 W, active PFC, enclosed or IEC-inlet so DIY users never wire mains screw terminals."
  examples:
    - name: "Mean Well RSP-750-12 (enclosed, fan-cooled)"
      specs:
        output: "12 V, 62.5 A, 750 W (distributor listings; datasheet series table)"
        pfc: "Active PFC, PF typ. 0.97 @230 VAC / 0.98 @115 VAC full load (datasheet, read)"
        efficiency_typ: "87 % (12 V model, datasheet)"
        safety: "UL62368-1, CSA C22.2 62368-1, TUV EN/IEC 62368-1 (datasheet)"
        size_mm: "250 x 127 x 41"
        ac_input: "Terminal block TB1 (datasheet 'AC Input Terminal' pin assignment) - mains is wired by the user"
        extras: "Remote ON/OFF, DC-OK, 12V/0.1A aux on CN50; has a fan"
      source: "https://www.meanwell.com/Upload/PDF/RSP-750/RSP-750-SPEC.PDF"
      retailer: "https://uk.rs-online.com/web/p/switching-power-supplies/7704059"
      verified_on: 2026-10-10
      notes: "DISQUALIFIED for the no-mains-terminals goal: AC enters on TB1 terminal block. Fan = noise in bedroom."
    - name: "Mean Well UHP-750-12 (slim, convection, 41 mm)"
      specs:
        output: "12 V, 60 A, 720 W (listing + datasheet series)"
        pfc: "Active PFC, PF >= 0.95 @230 VAC, >= 0.98 @115 VAC (datasheet, read)"
        efficiency_typ: "93.5 % (12 V)"
        safety: "UL62368-1, TUV EN/IEC 62368-1 (datasheet)"
        size_mm: "237 x 100 x 41"
        ac_input: "Terminal block TB1; DC out TB2/TB3 (datasheet)"
        cooling: "Convection, needs derating / aluminium plate or forced air at high load (datasheet cooling notes)"
      source: "https://www.meanwell.com/Upload/PDF/UHP-750/UHP-750-SPEC.PDF"
      retailer: "https://www.trcelectronics.com/products/mean-well-uhp-750-12"
      verified_on: 2026-10-10
      notes: "Fanless (good for noise) but AC screw terminals -> disqualified for plug-and-play. Needs an enclosure the builder must assemble."
    - name: "Delta PMR-12V600W1BT"
      specs:
        output: "12 V, 50 A, 600 W enclosed (distributor listing)"
        pfc: "built-in PFC; UL/IEC 62368-1 (listing, datasheet not opened)"
        ac_input: "Terminal block per listing"
      source: "https://www.trcelectronics.com/products/delta-pmr-12v600w1bt"
      verified_on: 2026-10-10
      notes: "Only listing seen; terminal-block input -> same problem. Datasheet not verified."
    - name: "XP Power CCH600PS12"
      specs:
        output: "12 V, 50 A, 600 W, PFC (listing)"
        cooling: "baseplate cooled (listing)"
        price: "approx USD 745 per unit (single listing)"
      source: "https://www.trcelectronics.com/products/xp-power-cch600ps12"
      verified_on: 2026-10-10
      notes: "Baseplate-cooled, no IEC inlet mentioned, expensive. Not suitable."
    - name: "Mean Well GST280A12-C6P (desktop adapter, IEC C14 inlet)"
      specs:
        output: "280 W 12 V class (listing says 21 A; 12 V x 21 A = 252 W, inconsistent -> unverified)"
        pfc: "PFC (listing)"
        ac_input: "3-pole IEC320-C14 inlet (listing)"
      source: "https://advantageelectricsupply.com/part/mean-well/gst280a12-c6p/2115600"
      verified_on: 2026-10-10
      notes: "Highest-power Mean Well desktop/IEC-inlet unit found. 3 TEC per side is about 18 A, so ONE adapter per side (two total) is a candidate that avoids mains wiring. Datasheet not opened - confirm current/connector before committing."
    - name: "Mean Well AS-120P (IEC C14, fully enclosed, active PFC)"
      specs:
        output: "120 W class (too small)"
        ac_input: "IEC320-C14"
        approvals: "UL, cUL, TUV, CB, CE (spec PDF listing)"
      source: "https://support.elmark.com.pl/meanwell/products/ac-dc/desktop/serii_gs_160-280w/as-120/specification/as-120p-spec.pdf"
      verified_on: 2026-10-10
      notes: "Too small; useful only for logic/pumps rail."
    - name: "HP/HPE common-slot server PSU (e.g. HSTNS-PL18 / DPS-800GB class, 750 W) + breakout board"
      specs:
        topology: "Server PSU with C14 inlet on the PSU; 12 V + GND edge connector (64-pin) with standby/enable/PMBus signals"
        breakout: "Seller boards: Tindie gumslone 'smart wifi server PSU breakout' (designed for HSTNS-PL18, others similar); multiple eBay/ubbcentral boards (seller claims)"
        efficiency_class: "listings call some units Platinum (seller claim, unverified)"
      source: "https://tindie.com/products/gumslone/smart-wifi-server-psu-breakout-board"
      retailer: "https://knightli.com/en/2026/04/16/csps-common-slot-server-power-supply-pinout/"
      verified_on: 2026-10-10
      notes: "No mains wiring (IEC cord), active PFC and high efficiency are normal for these PSUs, cheap/ubiquitous. BUT: server-PSU safety approval applies to the PSU, not to the DIY breakout; fan noise (small high-RPM fans) is a bedroom problem; pinouts differ per model so measure before powering; datasheet for PL18/PL30 NOT verified. Needs 12 V rail only; standby/enable pins must be set by breakout."
  findings: |
    No 12 V >=600 W Mean Well (or other) unit with an IEC inlet exists in the lines I could verify. Both RSP-750-12 and UHP-750-12
    use TB1 AC screw terminals (read in the datasheets). Options that avoid exposed mains terminals:
    (1) one IEC-C14 desktop adapter per bed side (Mean Well GST280A12-C6P class, about 18-21 A each) - cleanest for DIY, certified;
    (2) HP common-slot 750 W server PSU + breakout - cheap, IEC cord, high PFC, but fans and DIY breakout caveats;
    (3) any terminal-block PSU inside a pre-built, closed mains module (C14 inlet+fuse+switch) is a mains-wiring step for the maker - not DIY-safe.
    Sizing note: 6 TEC x ~6 A = ~36 A (~430 W) worst case plus pumps, so 600 W is a safe ceiling; two 280 W units fit if TEC current is capped at ~18 A per side.

- role: tec_module
  requirement: "40x40 127-couple, ~6 A, 12 V."
  examples:
    - name: "TEC1-12706 (Hebei I.T. Shanghai / HB Corporation datasheet)"
      specs:
        th_25C: {Qmax_W: 50, dTmax_K: 66, Imax_A: 6.4, Vmax_V: 14.4, resistance_ohm: 1.98}
        th_50C: {Qmax_W: 57, dTmax_K: 75, Imax_A: 6.4, Vmax_V: 16.4, resistance_ohm: 2.30}
        size: "40 x 40 mm, thickness 3.2-3.8 mm depending on seller"
        couples: 127
        seebeck_K: "NOT published in the datasheet"
      source: "https://www.radiolocman.com/datasheet/pdf.html?di=173597"
      retailer: "https://soselectronic.com/en/products/various/peltier-6300-127-060-tec1-12706-1829"
      verified_on: 2026-10-10
      notes: "Datasheet copy (Rev 2.03 per search) gives no Seebeck or thermal conductance. Vendor listings contradict each other (Qmax 50-92 W, dTmax 66-70 K, Imax 6-6.4 A), so budget parts are not spec-reliable. Naive Vmax/Imax = 2.25 ohm vs sheet 1.98 ohm: do not back-compute alpha/K from it. No independent bench data found."
    - name: "TRU Components TEC1-12706 (Conrad)"
      specs: {Vmax_V: 15, Imax_A: 6.4, Qmax_W: 65, size_mm: "40 x 40 x 3.8"}
      source: "https://asset.conrad.com/media10/add/160267/c1/-/en/000189115DS02/datablad-189115-tru-components-tec1-12706-peltier-element-15-v-64-a-65-w-l-x-b-x-h-40-x-40-x-38-mm.pdf"
      verified_on: 2026-10-10
      notes: "EU-retail relabel; datasheet text not opened beyond search summary; dTmax about 70 K claimed."
    - name: "Thermonamic TEC1-12706 (Akizuki sheet)"
      specs: {couples: 127, degradation_claim: "about 2.5 % after 300,000 thermal cycles (manufacturer claim)"}
      source: "https://akizukidenshi.com/goodsaffix/TETC1-12706.pdf"
      verified_on: 2026-10-10
      notes: "Only source with a lifetime claim. Not independently verified."
    - name: "Same Sky (ex CUI Devices) CP85438"
      specs: {size_mm: "40 x 40 x 3.8", Imax_A: 8.5, Vmax_V: 15.4, Qmax_W: "75.0 @ Th=27C / 83.9 @ 50C", dTmax_K: "68 / 75", resistance_ohm: 1.50, couples: "not stated in sources"}
      source: "https://www.digikey.com/en/products/detail/same-sky-formerly-cui-devices/CP85438/1747374"
      retailer: "https://cdn.eicom.ru/media/PDF/1594082.pdf"
      verified_on: 2026-10-10
      notes: "Branded, datasheet-backed alternative but Imax 8.5 A is not a 6 A part (needs different driver sizing). Couple count not confirmed."
    - name: "Laird / Tark (Laird Thermal Systems, now Ezurio) CP2-127-06-L2-W12"
      specs: {note: "Part exists on Laird site (301 redirect to tark-solutions.com); datasheet fetch returned HTTP 406 - specs NOT verified"}
      source: "https://lairdthermal.com/products/thermoelectric-cooler-modules/peltier-cp-series/CP2-127-06-L2-W12/pdf"
      verified_on: 2026-10-10
      notes: "Laird CP10,127,05 is a 30 mm module (3.9 A, 14.4 V) - not 40x40."
    - name: "European Thermodynamics TEC1-12712L-S"
      specs: {note: "listing exists at DigiKey; specs not verified"}
      source: "https://azcus.digikey.com/en/products/detail/european-thermodynamics-ltd/TEC1-12712L-S/13566815"
      verified_on: 2026-10-10
      notes: "Not verified."
  findings: |
    TE Technology, Marlow and Kryotherm datasheets were NOT found/verified in this pass. Verified: TEC1-12706 datasheet gives Qmax/dTmax/Imax/Vmax/R but no Seebeck or K;
    branded parts (Same Sky CP-series, Laird) publish Imax/Vmax/Qmax/dTmax/R, with alpha/K only via vendor tools (not confirmed).
    Practical: treat any Chinese 12706 as +-20 % in Qmax, characterise a sample on the bench, derate to ~70 % of Imax, hold hot side < 50-55 C.

- role: tec_drive
  requirement: "Smooth DC (current-controlled), not raw PWM, ~6 A per TEC, reversible polarity, 3 TEC per side (~18 A/side), controllable from ESP32/Pico."
  examples:
    - name: "(a) Riden/DPS-class programmable CC/CV buck supply: DPS5020 (50 V, 20 A)"
      specs:
        range: "up to 50 V / 20 A (scargill review)"
        interface: "UART Modbus RTU, 3.3 V logic, 9600 baud 8 data bits (commenter code), slave ID settable"
        input: "buck only: output cannot exceed input; ~10 % headroom advised"
        ripple: "not stated (author had not measured)"
        reported_issue: "an early version had a failed output capacitor; noisy fan"
      source: "https://tech.scargill.net/dps5020-diy-power-supply/"
      verified_on: 2026-10-10
      notes: "Fits 3 TEC in parallel (18 A < 20 A) from ONE unit per side, or 3 TEC in series at ~6 A (inference). Needs DPDT/2xSPDT polarity relay switched only with output disabled. Price not verified."
    - name: "(a) Riden RD6012 (60 V, 12 A, 720 W)"
      specs:
        range: "0-60 V, 0-12 A (RD6012P spec sheet at cnx-software)"
        ripple: "20 mVpp voltage ripple (RD6012P)"
        interface: "Modbus RTU 115200 8N1 (RD6006 protocol PDF); register map differs from DPS series; ESPHome config referencing wildekek/rdtech-esphome exists"
      source: "https://www.cnx-software.com/2021/12/15/riden-rd6012p-usb-wifi-dc-power-supply-connects-to-your-pc-or-smartphone/?amp=1"
      retailer: "https://git.commander1024.de/Commander1024/homeassistant-config/src/branch/energymonitor/esphome/riden-labornetzteil-6a.yaml"
      verified_on: 2026-10-10
      notes: "12 A max -> 2 TEC parallel per unit (or 3 in series at 6 A, 36 V, inference). Protocol docs: https://redmine.laas.fr/attachments/download/4768/RD6006_prtotocol_en.pdf"
    - name: "(b) Meerstetter TEC-1091 / TEC-1122 / TEC-1123"
      specs:
        TEC-1091: "0..+-21 V, 0..+-4 A, about USD 371-393 (reseller listings conflict)"
        TEC-1122: "2 channels, +-10 A / 21 V each, USD 980-1615 (listings conflict)"
        TEC-1123: "2 channels, +-16 A / 30 V each, USD 1016-1223"
      source: "https://shop.laserdiodesource.com/laser-diodes-by-each-manufacturer/meerstetter-engineering/filtered-by-categories-tec-controllers"
      verified_on: 2026-10-10
      notes: "Only reseller pages; Meerstetter datasheets not opened. 1091 too small (4 A); 1122/1123 are 10-25x the cost target. Rejected on price. A 'TEC-8A-24V-PID-HC-RS232' controller appeared in a search snippet (Botland) but page was unusable - unverified."
    - name: "(b/c) TI DRV8262 dual H-bridge (TEC mode) + external LC filter"
      specs:
        supply: "4.5-65 V"
        current: "10 A full-scale per H-bridge, 20 A paralleled; DRV8262EVM listed at 5 A (10 A paralleled), DRV8262VEVM at 10 A"
        tec_guidance: "datasheet TEC section: PWM + 2nd-order LC filter, ripple < 10 % of max current, can drive two TECs bidirectionally"
      source: "https://ti.com/document-viewer/DRV8262/datasheet/GUID-43C3983F-1D1B-46F2-9CA0-E192E8B4076E"
      retailer: "https://www.ti.com/tool/DRV8262VEVM"
      verified_on: 2026-10-10
      notes: "Silicon-vendor evidence that filtered PWM is acceptable and ripple should be <10 %. Needs a custom PCB (not off-the-shelf module); paralleled outputs for 18 A per side."
    - name: "(c) BTS7960 / IBT-2 43 A H-bridge module + LC filter"
      specs: {note: "No datasheet or TEC application note was found/opened in this pass; use TI 10 % ripple rule as design target"}
      source: "https://www.ti.com/document-viewer/DRV8962/datasheet/GUID-237211BD-2D0F-43ED-8430-2275F5A03369"
      verified_on: 2026-10-10
      notes: "Unverified for TEC use. DIY precedents: Cytron MD13S raw PWM (opencooler, capacitors ran hot); low-side IRLZ44N MOSFET PWM (jojaritz); inductor+capacitor per TEC + relays (TechTeamGB)."
  findings: |
    Realistic OTS path for 3 TEC/side (~18 A) from an ESP32/Pico: one programmable CC/CV buck supply per side (DPS5020-class, 20 A, Modbus RTU over UART at 3.3 V)
    + one DPDT polarity relay (break-before-make, output disabled while switching) = zero custom power electronics, smooth DC, current limit in the supply.
    RD6012 (12 A) needs 2 units per side or a series string. Dedicated Meerstetter controllers are technically ideal but USD 370-1600 each and the 4 A model is too small.
    The DIY option (H-bridge + LC filter, TI-style <10 % ripple) is cheaper but needs a custom inductor/PCB and was only seen as raw PWM in the DIY repos.
    Caveats: buck supplies cannot exceed input; the supply's setpoint is software (Modbus), so keep a hardware current limit and independent thermal cutoff; large output capacitors make relay switching under load a wear item;
    DPS5020 ripple unverified. Prices for DPS/RD units NOT verified in this research.

- role: water_block_heatsink_kit
  requirement: "TEC + water block + air heatsink + fan assemblies, or TEC on aluminium water block + separate CPU tower."
  examples:
    - name: "Generic 'TEC1-12706 water cooling / peltier water chiller DIY kit' (single TEC)"
      specs:
        contents: "conduction module + water block 40x40x12 mm + TEC1-12706 + 40x40x10 fan + base board + grease + screws"
        conduction_module_mm: "60 x 45 x 21"
        thermal_resistance: "NOT published"
      source: "https://www.makerlab-electronics.com/products/thermoelectric-tec12706-tec-12706-peltier-cooling-system-heatsink-kit-air-cooled-liquid-cooled"
      retailer: "https://www.ubbcentral.com/store/item/DIY-Kits-Thermoelectric-Peltier-Refrigeration-Cooling-System-Fan-TEC1-12706_266606524070.html"
      verified_on: 2026-10-10
      notes: "Single-TEC, fan too small for ~100 W hot-side load. Seller warnings: never run without hot-side sink. 120 W liquid chiller core kit: https://probots.co.in/120w-thermoelectric-liquid-chiller-core-12v-peltier-water-cooling-diy-kit.html (specs not opened)."
    - name: "TEC sandwiched between 40x80 mm aluminium water block and a CPU tower cooler (opencooler prototype)"
      specs: {blocks: "40x80 mm aluminium water blocks", hot_side: "~USD 20 CPU air cooler", tec: "TEC12703 -> 12715 -> 12706 tried"}
      source: "https://hackaday.io/project/205182-opencooler"
      verified_on: 2026-10-10
      notes: "V1 final test (June 2026) FAILED: one TEC side warm, the other barely chilled the water; do not mix aluminium and copper in the loop; heatsink mounts must isolate the copper heat block."
  findings: |
    No published thermal resistance (K/W) for any kit or block found (as expected). Kit listings only give size/contents. Design must measure the hot-side and cold-side
    resistance on the bench. Evidence from the DIY repos: parallel TEC arrays with a separate hot-side loop + 360 mm radiator (jojaritz), or TEC between water block and tower cooler (opencooler, underperformed).

- role: pump
  requirement: "12 V, tach output, >=0.5 L/min at >=1 m head, quiet, continuous duty."
  examples:
    - name: "Laing/Xylem D5 PWM (12 V) - FloJet/Lowara/EK motor"
      specs:
        flow_head: "max 1200 l/h at up to 3.65 m (FloJet listing); 1500 l/h / 3.70 m (Lowara listing)"
        speed: "PWM 800-4800 rpm; operating 8-24 V"
        power: "23 W at 12 V (Digitec listing)"
        tach: "tach/feedback wire (green) used in the openbed ESP32 wiring table; D5 PWM spec not verified from Xylem datasheet"
        noise: "no dB(A) figure found"
      source: "https://www.watercoolinguk.co.uk/product/laing-flojetd5-pwm-pump-motor-12v-1200-lph/"
      retailer: "https://digitec.ch/en/s1/product/xylem-lowara-d5-pwm-pump-water-cooling-pumps-13209069"
      verified_on: 2026-10-10
      notes: "Older (pre-G2) PWM D5 defaults to a fixed duty without PWM feedback (forum); EK D5 PWM G2 listing: duty ~20-100 %, 100 % if no signal. Dissipates up to ~20 W into the loop at full speed. Opencooler author: D5 about USD 80, 5 years life vs ~2 for cheap pumps."
    - name: "Aqua Computer D5 NEXT"
      specs: {flow_head: "1500 l/h, 3.7 m", power: "65 W max incl. fan/RGB output", supply: "5 or 12 V"}
      source: "https://shop.aquacomputer.de/Wasserkuehlung/Pumpen-Zub/Pumpen/D5-NEXT-Pumpe::3785.html"
      verified_on: 2026-10-10
      notes: "Has its own controller/display (USB, tach/flow data); overkill and expensive. dB not found."
    - name: "Laing DDC (12 V) PWM"
      specs: {note: "listings only, 4.2 PWM variant; specs not fetched"}
      source: "https://www.aquatuning.com/en/watercooling/custom/pumps"
      verified_on: 2026-10-10
      notes: "jojaritz repo drives two DDC PWM pumps at 25 kHz; DDC specs/noise not verified."
    - name: "DC40-class brushless 12 V pumps (Decdeal/Bayite/generic)"
      specs: {example_listing: "DC40: 12/24 V, 7 m lift, '<40 dB' (seller), flow figures conflict (600 L/h vs 11 L/min)"}
      source: "https://china.org.ru/product/60653090725"
      retailer: "https://www.manomano.co.uk/p/dc-12v-brushless-submersible-water-pump-800lh-5m-for-solar-circulation-system-water-pump-pool-fountain-88314605"
      verified_on: 2026-10-10
      notes: "Exact Bayite DC40A-1230 / Decdeal DC40-1250 listings not found; noise numbers are seller claims and tach availability not verified. Barrow pumps not verified."
  findings: |
    0.5 L/min at 1 m head is trivially inside a D5/DDC envelope (D5 max about 3.7 m, >1000 l/h); the real issue is running a D5 at 800-1500 rpm for noise while the loop (4 mm tubing) adds resistance;
    TechTeamGB ran a D5 on ~30 m of 4 mm ID tubing. D5/DDC PC pumps are the only candidates with usable documented PWM speed control and a tach wire. Noise (dB) is NOT documented by the makers; measure.

- role: flow_sensor
  requirement: "0.3-1 L/min range, accurate at low flow."
  examples:
    - name: "YF-S401 (Hall turbine, DFRobot SEN0216 spec)"
      specs: {range: "0.3-6 L/min", accuracy: "+-5 % (0.3-3 L/min)", pulses: "5880 per litre (other listings: 1-5 L/min, 4380 pulses/L)", mounting: "vertical, tilt <= 5 deg"}
      source: "https://wiki.dfrobot.com/sen0216/"
      verified_on: 2026-10-10
      notes: "Cheapest; low-end limits conflict between sellers. At 0.3 L/min the output is only ~29 Hz."
    - name: "Aqua Computer MPS Flow 100 (G1/4)"
      specs: {range: "20-100 l/h (0.33-1.67 L/min)", note: "inlets with < 8 mm ID need an extension for reliable reading"}
      source: "https://www.watercoolinguk.co.uk/p/Aquacomputer-flow-sensor-MPS-Flow-100_69575.html"
      verified_on: 2026-10-10
      notes: "Only PC-watercooling sensor found whose span matches 0.3-1 L/min. Output signal / accuracy not verified; Aqua Computer sensors target their own controllers."
    - name: "Aqua Computer high flow LT / high flow 2 / NEXT (G1/4)"
      specs: {range: "40-1000 l/h (0.67-16.7 L/min); LT listing at one reseller 35 l/h"}
      source: "https://shop.aquacomputer.de/Monitoring-and-Controlling/Sensors/Flow-sensor-high-flow-LT-G1-4::3951.html"
      verified_on: 2026-10-10
      notes: "Lower limit 0.67 L/min -> does NOT cover 0.3-0.67 L/min. No accuracy figure published."
    - name: "Gems Sensors FT-110 turbine"
      specs: {range: "variants 0.5-5 L/min and 0.5-35 L/min (RS listings)", accuracy: "+-3 % of reading, repeatability 0.5 % (Gems page)"}
      source: "https://www.farnell.com/datasheets/1877507.pdf"
      retailer: "https://se.rs-online.com/web/p/flow-sensors/9074031"
      verified_on: 2026-10-10
      notes: "Most credible accuracy claim, but 0.5 L/min minimum and industrial price; 4 mm-tube loop fittings differ."
  findings: |
    Accuracy "at low flow" is only documented for Gems FT-110 (+-3 % of reading, min 0.5 L/min) and YF-S401 (+-5 % for 0.3-3 L/min per DFRobot). For 0.3-1 L/min the
    Aqua Computer MPS Flow 100 is the only span match found; the 'high flow' family starts at 40 l/h. Treat flow as a coarse safety interlock (flow present/absent, +-10 %), not a metrologic reading; calibrate in situ.

