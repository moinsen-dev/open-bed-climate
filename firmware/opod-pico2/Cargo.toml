[package]
name = "opod-pico2"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Open Bed Climate control firmware for the Raspberry Pi Pico 2 (RP2350)"

[dependencies]
cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10", features = ["rp235xa", "time-driver", "critical-section-impl", "defmt", "binary-info"] }
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["defmt"] }
embedded-io-async = "0.7.0"
opod-core = { version = "0.1.0", path = "../opod-core" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[profile.release]
debug = 2
lto = true
opt-level = "s"
