[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Flash + run over SWD with a debug probe (e.g. a second Pico running debugprobe):
runner = "probe-rs run --chip RP235x"
# Without a probe: `picotool load -u -v -x -t elf <file>` while holding BOOTSEL.

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "info"
