# Concrete open tasks per contributor role (01-content §5). `role` is the /contribute/#anchor.
# `link` is a site route, or "repo:<path>" / "issue:<template>" which pages resolve against REPO_URL.
# Re-check against STATE.md whenever STATE is refrozen.
- id: build-solo
  role: builder
  task: Build the Solo Starter and post a build report
  source: README · hardware/README.md
  link: "issue:build-report.yml"
  difficulty: hard
- id: commissioning
  role: builder
  task: Run the 5-step commissioning checklist and report the results
  source: SAFETY.md
  link: /docs/safety/
  difficulty: medium
- id: m1
  role: builder
  task: Measure body-to-water heat transfer through a typical topper (heated dummy pad at 34 °C)
  source: OPEN-DECISIONS measurement 1
  link: "repo:docs/design/OPEN-DECISIONS.md"
  difficulty: medium
- id: m2
  role: builder
  task: Measure cold-plate thermal resistance per Peltier with real clamping
  source: OPEN-DECISIONS measurement 2
  link: "repo:docs/design/OPEN-DECISIONS.md"
  difficulty: medium
- id: m3
  role: builder
  task: Measure heatsink resistance vs. fan noise (target ≤ 30 dB(A)); replaces the kit heatsink ESTIMATE values
  source: OPEN-DECISIONS measurement 3 · kit TOML comments
  link: "repo:docs/design/OPEN-DECISIONS.md"
  difficulty: medium
- id: m5
  role: builder
  task: Test condensation at 15 °C water and 60 % RH
